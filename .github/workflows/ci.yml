name: CI Pipeline

on:
  push:
    branches: [main, feature/**]
  pull_request:
    branches: [main]

jobs:
  backend-lint-and-test:
    name: Backend Lint, Type Check, and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install Backend Dependencies
        run: |
          uv venv
          uv pip install -e "./backend[dev]"

      - name: Run Ruff Lint Check
        run: |
          .venv/bin/ruff check backend

      - name: Run Mypy Type Check
        run: |
          cd backend && ../.venv/bin/mypy app tests

      - name: Run Pytest Suite with Coverage
        run: |
          .venv/bin/pytest backend/tests --cov=app --cov-report=term-missing

  frontend-lint-and-test:
    name: Frontend Lint, Type Check, and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Run TypeScript Check
        working-directory: ./frontend
        run: pnpm run typecheck || npx tsc --noEmit

      - name: Build Frontend
        working-directory: ./frontend
        run: pnpm run build
